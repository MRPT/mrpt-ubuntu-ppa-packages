# Paste this block inside the <VirtualHost *:443> section of
# /etc/apache2/sites-available/000-default-le-ssl.conf on ingmec.ual.es,
# e.g. right before the closing "</VirtualHost>".
#
# Requires: a2enmod proxy proxy_http (already enabled as of 2026-09) and
# htpasswd file created once with:
#   sudo htpasswd -c /etc/apache2/mrpt-trigger.htpasswd <username>

<Location /mrpt-trigger>
    AuthType Basic
    AuthName "MRPT PPA trigger"
    AuthUserFile /etc/apache2/mrpt-trigger.htpasswd
    Require valid-user

    ProxyPass http://127.0.0.1:8765/
    ProxyPassReverse http://127.0.0.1:8765/
</Location>
