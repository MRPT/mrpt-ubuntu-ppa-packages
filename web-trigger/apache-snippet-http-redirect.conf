# Paste this block inside the <VirtualHost *:80> section of
# /etc/apache2/sites-available/000-default.conf on ingmec.ual.es.
# Basic Auth must never be sent over plain HTTP, so the path is only
# served on :443 (see apache-snippet-ssl.conf); this just redirects it.

<Location /mrpt-trigger>
    Redirect permanent /mrpt-trigger https://ingmec.ual.es/mrpt-trigger
</Location>
